<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="campfin">
  <!-- A tent with a euro coin in front of it: camp + money, the two halves of the app.
       Every shape is a path — no <text> — so the euro sign renders identically on both
       phones instead of depending on whatever font the OS hands the SVG.

       No background tile: the shapes sit straight on whatever page is behind them. An
       <img> cannot read the page's custom properties, so it cannot follow the day/night
       toggle — the hexes below are therefore literal, chosen once rather than per theme,
       and picked so the tent and the plank (the only two shapes that touch the page
       directly, rather than sitting inside the coin) hold contrast against both a
       near-white day background and a near-black night one. -->
  <path d="M25 10 L45 44 H5 Z" fill="#18a53b"/>
  <path d="M25 21 L34 44 H16 Z" fill="#171717"/>
  <rect x="3" y="41.5" width="42" height="6" rx="3" fill="#78716c"/>
  <circle cx="45" cy="44" r="14" fill="#b45309"/>
  <circle cx="45" cy="43.4" r="13.1" fill="#fbbf24"/>
  <g fill="none" stroke="#171717" stroke-width="2.95" stroke-linecap="round">
    <path d="M50.7,36.4 A8.2,8.2 0 1 0 50.7,49.6"/>
    <path d="M36.0,41.0 H47.5"/>
    <path d="M36.0,45.0 H45.8"/>
  </g>
</svg>
