<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="campfin">
  <!-- A sheet of accounts on a solid blue tile. The tile is what gives the mark contrast,
       so one file serves both themes.
       The sheet's top-right corner is folded back rather than squared off: a plain rounded
       rectangle with stripes inside reads as a battery cell at icon size, and the fold is
       what breaks that silhouette.
       Two entry rows sit above a thin rule, and the bottom line is the total - an amount
       bar closed by a euro sign on the right, the way a printed total reads. -->
  <rect width="512" height="512" rx="114" fill="#5A9CE8"/>

  <!-- sheet, with the corner cut away and the fold drawn back over it.
       It fills most of the tile and is taller than it is wide, the proportions of a
       printed page, so it never reads as a square label. -->
  <path d="M128,44 H352 L412,104 V440 a28,28 0 0 1 -28,28 H128 a28,28 0 0 1 -28,-28 V72 a28,28 0 0 1 28,-28 Z" fill="#f5f6f7"/>
  <path d="M352,44 L412,104 H372 a20,20 0 0 1 -20,-20 Z" fill="#4a90e8" opacity=".35"/>

  <!-- entry rows -->
  <rect x="140" y="168" width="188" height="28" rx="14" fill="#4a90e8"/>
  <rect x="140" y="226" width="116" height="28" rx="14" fill="#4a90e8" opacity="0.65"/>

  <!-- rule, then the total line -->
  <path d="M140,298 H372" stroke="#4a90e8" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <rect x="140" y="344" width="132" height="28" rx="14" fill="#4a90e8"/>
  <g transform="translate(340,358) scale(1.12) translate(-207,-306)" fill="none" stroke="#4a90e8" stroke-width="6.19" stroke-linecap="round">
    <path d="M234.3,290.5 A25.3,25.3 0 1 0 234.3,321.5"/>
    <path d="M181.5,299.5 H230.0"/>
    <path d="M181.5,311.7 H225.0"/>
  </g>
</svg>
