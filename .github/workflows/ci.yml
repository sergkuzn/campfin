# Runs checks — lint, typecheck, tests, build — on every branch push.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

# A new commit on the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `lint:ci` checks without writing, so formatting drift fails the run
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build
